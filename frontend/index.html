<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <button id="createRoom">Create Room</button>
    </div>
    <div id="inbox"></div>
    <form id="chat">
        <input type="text" id="chatMessage" autocomplete="off">
        <input type="submit" value="Send">
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const chat = document.getElementById('chat');
        const chatMessage = document.getElementById('chatMessage');
        const createRoom = document.getElementById('createRoom');
        let room = getParameterByName("id") || "public";

        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        chat.addEventListener('submit', (e) => {
            e.preventDefault();
            if (chatMessage.value) {
                socket.emit('chatMessage', room, chatMessage.value);
                chatMessage.value = '';
            }
        });

        socket.on('inbox', (msg) => {
            const elem = document.createElement('div');
            elem.id = 'text';
            elem.textContent = msg;
            document.getElementById('inbox').appendChild(elem);
            window.scrollTo(0, document.body.scrollHeight);
        });

        createRoom.addEventListener('click', async () => {
            fetch("/api/createRoom")
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                })
                .then(data => {
                    console.log(data);
                    window.location.href = data.room;
                })
        });
    </script>
</body>
</html>
