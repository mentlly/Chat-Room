<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../staticFiles/styles.css">
</head>
<body>
    <div id="main2" class="container">
        <form id="user">
            <input type="text" id="userName" autocomplete="off" hidden>
            <input type="submit" id="userSubmit" value="Enter UserName">
        </form>
        <div id="codeRoom"></div>
    </div>
    <div id="main">
        <div>
            <button id="createRoom">Create Room</button>
            <form id="joinRoom">
                <input type="text" id="roomCode" autocomplete="off" hidden>
                <input type="submit" value="Join Room">
            </form>
        </div>
        <div id="inbox"></div>
        <form id="chat">
            <input type="text" id="chatMessage" autocomplete="off">
            <input type="submit" value="Send">
        </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../staticFiles/index.js"></script>
</body>
</html>
